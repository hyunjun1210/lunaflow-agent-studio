<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="챗봇, 동작, 이펙트 에이전트를 한곳에서 실행하는 LunaFlow 작업 공간">
  <meta name="theme-color" content="#fbfaf7">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'">
  <title>LunaFlow Agent Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="spark" viewBox="0 0 48 48"><path d="M24 0C25.8 15.5 32.5 22.2 48 24 32.5 25.8 25.8 32.5 24 48 22.2 32.5 15.5 25.8 0 24 15.5 22.2 22.2 15.5 24 0Z"/></symbol>
    <symbol id="hub" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></symbol>
    <symbol id="helper" viewBox="0 0 24 24"><path d="M20.5 11.2a7.8 7.8 0 0 1-8 7.5 9 9 0 0 1-3.2-.6l-4.6 1.7 1-4A7.2 7.2 0 0 1 4.5 11c0-4.1 3.6-7.4 8-7.4s8 3.3 8 7.5Z"/><path d="M9 11h.1m3.3 0h.1m3.3 0h.1" stroke-width="2.4"/></symbol>
    <symbol id="director" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="vfx" viewBox="0 0 24 24"><path d="M10 3c0 5-2 7-7 7 5 0 7 2 7 7 0-5 2-7 7-7-5 0-7-2-7-7Zm8 10v7m-3.5-3.5h7M19 3v4m-2-2h4"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9m7-1v7H5V6h7"/></symbol>
  </svg>

  <aside class="sidebar">
    <a class="brand" href="#home">
      <span class="brand-mark"><svg aria-hidden="true"><use href="#spark"/></svg></span>
      <span>LunaFlow<small>Agent Studio</small></span>
    </a>
    <nav aria-label="작업 공간">
      <a class="nav-link" href="#home" data-route="home" aria-label="에이전트 허브"><svg aria-hidden="true"><use href="#hub"/></svg><span>에이전트 허브</span></a>
      <p class="nav-label">에이전트</p>
      <div id="agent-nav"></div>
    </nav>
    <div class="sidebar-footer">
      <svg aria-hidden="true"><use href="#vfx"/></svg>
      <span>Microsoft Copilot Studio</span>
    </div>
  </aside>

  <main id="main">
    <header class="topbar">
      <div class="breadcrumb">
        <a href="#home">작업 공간</a>
        <svg aria-hidden="true"><use href="#chevron"/></svg>
        <strong id="location">에이전트 허브</strong>
      </div>
    </header>

    <section id="home" class="dashboard">
      <div class="hero">
        <svg class="hero-mark" viewBox="0 0 84 84" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="mark-surface" x1="8" y1="6" x2="71" y2="78" gradientUnits="userSpaceOnUse">
              <stop stop-color="#fffaf1"/>
              <stop offset=".53" stop-color="#f1eaff"/>
              <stop offset="1" stop-color="#e7edff"/>
            </linearGradient>
            <linearGradient id="mark-light" x1="24" y1="65" x2="63" y2="16" gradientUnits="userSpaceOnUse">
              <stop stop-color="#5264cb"/>
              <stop offset=".55" stop-color="#7951c5"/>
              <stop offset="1" stop-color="#b683d4"/>
            </linearGradient>
          </defs>
          <rect x="7" y="7" width="70" height="70" rx="24" fill="url(#mark-surface)" stroke="#e4ddf1"/>
          <ellipse cx="42" cy="42" rx="37" ry="13" transform="rotate(-29 42 42)" stroke="#9985cc" stroke-opacity=".55"/>
          <use href="#spark" x="22" y="22" width="40" height="40" fill="url(#mark-light)"/>
          <circle cx="70" cy="23" r="3.2" fill="#9776cf"/>
          <circle cx="16" cy="61" r="2.2" fill="#a18ed4"/>
        </svg>
        <h1 tabindex="-1">어떤 작업을 <span>시작할까요?</span></h1>
        <p class="intro">질문, 동작, 이펙트. 작업에 맞는 에이전트와 대화를 시작하세요.</p>
      </div>
      <div class="agent-picker">
        <h2>에이전트 선택</h2>
        <div class="cards" id="agent-cards"></div>
      </div>
    </section>

    <section id="chat" class="chat" hidden>
      <div class="chat-heading">
        <div class="chat-identity">
          <span id="chat-icon"></span>
          <div><h1 id="chat-title" tabindex="-1"></h1><p id="chat-description"></p></div>
        </div>
        <a id="external-chat" target="_blank" rel="noopener noreferrer">
          <span>Copilot Studio에서 열기</span><svg aria-hidden="true"><use href="#external"/></svg>
        </a>
      </div>
      <div class="chat-surface" id="chat-surface"></div>
    </section>
  </main>
</body>
</html>
